services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-freelance_platform}
      MYSQL_USER: ${DB_USERNAME:-freelance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-freelance_dev_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_only}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_only}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-freelance_platform}?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-freelance}
      DB_PASSWORD: ${DB_PASSWORD:-freelance_dev_only}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PAYMENT_SANDBOX_WEBHOOK_SECRET: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:?Set PAYMENT_SANDBOX_WEBHOOK_SECRET in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      mailpit: { condition: service_started }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["8025:8025"]
volumes:
  mysql_data:
