spring:
  application:
    name: freelance-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/freelance_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:freelance}
    password: ${DB_PASSWORD:freelance_dev_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  payments:
    sandbox-webhook-secret: ${PAYMENT_SANDBOX_WEBHOOK_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  files:
    directory: ${APP_UPLOAD_DIR:./var/private-uploads}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
